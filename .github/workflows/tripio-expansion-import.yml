name: Import Tripio expansion
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify delta parts
        run: |
          curl -fL -o /tmp/d1.zip "https://github.com/gmf2/travel-planner-app/releases/download/tripio-expansion-20261104/tripio-delta-1.zip"
          curl -fL -o /tmp/d2.zip "https://github.com/gmf2/travel-planner-app/releases/download/tripio-expansion-20261104/tripio-delta-2.zip"
          echo "307f54ce33d64c2698267a3994bb7273690e7a1a57cd6aa218e75b80047008d0  /tmp/d1.zip" | sha256sum -c -
          echo "a1569df26bd2f0068ae336d07274742d85cc61ed3c9d19f3af1ef3fb462a3e43  /tmp/d2.zip" | sha256sum -c -
      - name: Unpack over checkout
        run: |
          unzip -o /tmp/d1.zip -d .
          unzip -o /tmp/d2.zip -d .
      - name: Sanity checks
        run: |
          node --check asia-routes.js && node --check poland-pilot.js
          python3 -c "import json; d=json.load(open('data/pl/index.json')); assert len(d['cities'])==95; r=json.load(open('data/routes/index.json')); assert len(r['countries'])==52; print('sanity ok')"
      - name: Commit expansion
        run: |
          git config user.name "tripio-import"
          git config user.email "tripio-import@users.noreply.github.com"
          git add -A
          git commit -m "Expansion Tripio: 33 ciudades + 12 regiones Europa y 52 paises Asia (contenido revisado 2026-11-03)"
          git push
      - name: Self-remove workflow
        run: |
          git config user.name "tripio-import"
          git config user.email "tripio-import@users.noreply.github.com"
          git rm -q .github/workflows/tripio-expansion-import.yml
          git commit -m "Elimina workflow temporal de importacion"
          git push
