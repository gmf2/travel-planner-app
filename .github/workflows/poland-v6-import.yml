name: Publish reviewed Poland v6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed production files
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib
          p=pathlib.Path('1-poland-v6-release.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='6797f3b9a402a32de17a44d75f9e3845f1da50a7099ea54e55413008acfe92a7'
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  assert not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts
                  assert n=='poland-pilot.js' or n.startswith(('data/pl/','assets/'))
                  z.extract(n,'.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poland-pilot.js data/pl assets
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed Poland v6 excursions and visits-first layout'
            git push
          fi
