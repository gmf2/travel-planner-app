name: Import reviewed European catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import the complete reviewed release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,tarfile,io,json
          parts=sorted(Path('.').glob('*tripio-release.part*'),key=lambda p:p.name.rsplit('part',1)[1])
          assert len(parts)==18, len(parts)
          archive=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(archive).hexdigest()=='e2c521a1b4e140c92d6a91740617aceff2b29c497ed9e18cae7fc2069fa6b210'
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as t:
              for m in t.getmembers():
                  p=Path(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts
              t.extractall('.')
          manifests=list(Path('.').glob('*manifest.json'))
          assert len(manifests)==1
          for name,digest in json.loads(manifests[0].read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          for p in parts+manifests:p.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data tests editorial/EU-FINAL-REVIEW-20261030.md index.html poland-pilot.js enrichment-preview.js ui-preview.js previous-demo.html .nojekyll
          git add -u -- .
          git commit -m 'Publish all 38 reviewed European destinations together'
          git push origin HEAD:main
