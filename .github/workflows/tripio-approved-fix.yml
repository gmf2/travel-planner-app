name: Apply approved Christmas saved-plan fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed patch and remove this temporary importer
        env:
          PATCH_B64: 
        run: |
          python3 - <<'PYCODE'
          import os,base64,gzip,hashlib,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest() == '1c61191bf38be1c851b0df47e39cb125d7a5ae4bae973cf59165ea9ffa92fe43'
          pathlib.Path('/tmp/fix.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/fix.patch'],check=True)
          subprocess.run(['git','apply','/tmp/fix.patch'],check=True)
          PYCODE
          node --check poland-pilot.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data poland-pilot.js tests/curated-state-regression.cjs
          git rm .github/workflows/tripio-approved-fix.yml
          git commit -m 'Fix Christmas markets in saved plans while preserving user edits'
          git push
