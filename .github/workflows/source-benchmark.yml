name: Tripio speed and evidence fidelity benchmark
on:
  push:
    branches: [tripio-source-benchmark]
    paths: [.github/workflows/source-benchmark.yml]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gpt-oss-20b-MXFP4-chat
            url: https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/15dcfc7e7c608c6161507211ed43c5b590801b4b/gpt-oss-20b-MXFP4.gguf
            native: OFF
            kwargs: '{"reasoning_effort":"low"}'
            mode: chat
    steps:
      - name: Build pinned model-native template runtime
        run: |
          lscpu
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp llama.cpp
          git -C llama.cpp checkout e486a4b559617dc88bf79978996f6c670b6bbc9d
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=${{ matrix.native }} -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-server -j 4
      - name: Free disk space for large MoE weights
        if: contains(matrix.name, 'gpt-oss')
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/julia* /usr/share/swift 2>/dev/null || true
          df -h .
      - name: Download single public ungated GGUF
        env:
          MODEL_URL: ${{ matrix.url }}
        run: |
          df -h .
          free -m
          curl --fail --location --retry 1 --max-time 1800 "$MODEL_URL" --output model.gguf
      - name: Extract literal identities and exact source conditions
        env:
          MODEL_NAME: ${{ matrix.name }}
          MODEL_KWARGS: ${{ matrix.kwargs }}
          MODEL_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PYBENCH'
          import os,json,pathlib,time,subprocess,urllib.request,urllib.error
          out=pathlib.Path('benchmark-results');out.mkdir(exist_ok=True)
          cases=[{'id': 'ba-4', 'city': 'Buenos Aires', 'text': '![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2022/10/3-days-in-Buenos-AIres-768x1024.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2022/10/3-days-in-Buenos-AIres-768x1024.jpg?strip=all)\n\nAtelier Fuerza’s amazing medialuna\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2022/10/image_6483441-1-683x1024.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2022/10/image_6483441-1-683x1024.jpg?strip=all)\n\nCuervo in Chacarita\n\n#### Breakfast: Coffee and Medialunas \n\nWake up for a sleepy breakfast in your hotel or head to one of the many cafes offering “cafe de especialidad.” \n\nIn a city famous for overly sweet toasted coffee, it’s a welcome change.\n\nPastries have also been a major focus ever since 2020 turned us all into sourdough (masa madre) bread snobs, making breakfast (and mid-day merienda tea time) an elevated, enjoyable experience.\n\nAtelier Fuerza makes the best medialunas and pastries in the city and has multiple locations throughout the city.\n\nGo right when they open to make sure you get one of their famous Medialunas de Grasa, made with Wagyu fat (drool), before they sell out. \n\nCuervo is the OG café de especialidad in Buenos Aires, also with locations throughout the city. They have the best avocado toast and excellent coffee.\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-20.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-20.jpg?strip=all)\n\nEl Ateneo Grand Splendid, a bookstore in a historic theater\n\n#### El Ateneo Grand Splendid \n\nBuenos Aires has more bookstores per capita than any other city in the world.\n\nAmong the hundreds of bookstores to discover here, El Ateneo Grand Splendid is one that’s received international recognition as one of the most beautiful in the world (according to those who know at National Geographic and The Guardian).\n\nStart your day of touring here. Take a taxi or the subway to Av. Santa Fe 1860. \n\nThis breathtaking bookstore is housed in a historic theater. Take in the views from the ground floor then head upstairs to the second and third floors for the best views from above.\n\nIf you haven’t had breakfast yet grab a coffee and pastry from the café on the stage.\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-23.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-23.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-24.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-24.jpg?strip=all)\n\nPasaje del Correo\n\n#### Pasaje del Correo\n\nOne of the unexpected beauties of Buenos Aires are the many alleyways, or pasajes. \n\nThe Pasaje del Correo, also known as Pasaje Suizo, in Recoleta is particularly beautiful.\n\nIt’s only a few blocks from El Ateneo Grand Splendid so walk there, passing through leafy Plaza Vicente Lopez on the way.\n\nIn the Pasaje del Correo there are restaurants and cafes worth a stop if you’re still hungry. \n\n🍴Warning: I will be suggesting a lot of dining stops along the way today, far more than you can possibly take advantage of. Research them ahead of time to see which looks more interesting to you or just stop at the ones that you happen to be at when hunger strikes.\n\nIf you’re not hungry, simply take a photo and wander the surrounding streets. \n\nThey are typical of residential, non-touristy Recoleta. \n\nFrom here you are only a few blocks from the Recoleta Cemetery, our next stop. \n\nMeander down to Av. Alvear to see the mansions on your walk to the cemetery.\n\n#### Palaces & Wealth on Av. Alvear\n\nThere are plenty of ways to get to the cemetery from here and all will be beautiful, but I recommend walking down Avenida Alvear.\n\nThis wide avenue is lined with some of the city’s most impressive mansions.\n\nYou’ll see the Vatican Embassy, the Palacio Duhau, and Palacio Alvear.\n\nOne block before reaching the plaza where the cemetery is located you’ll cross Ayacucho street.\n\nHang left one block to shop in Arandu. \n\nThis saddle shop is housed in a beautiful three story home. \n\nYou can pick up high quality leather bags and belts, alpargata shoes (what the bran Tom’s modeled his shoe after), clothing, and authentic souvenirs. \n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-22.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-22.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-21.jpg?strip=all)\n\n'}, {'id': 'ba-5', 'city': 'Buenos Aires', 'text': '![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-21.jpg?strip=all)\n\n#### Recoleta Cemetery & Surroundings\n\nYou’ve now made it to one of the most important Buenos Aires landmarks.\n\nThe Recoleta Cemetery’s beautiful tombs are a veritable who’s who of Argentine history. \n\nYou’ll see the names of all the streets you’ve been walking on repeated here as past presidents, generals, and all around important historical figures are all buried in this aristocratic cemetery.\n\nThe most sought after grave is Evita’s. She’s buried with her family so you’ll see her family’s tomb under the name Duarte. \n\nIt’s on a narrow passageway but once you know where you’re going it’s easy to find, thanks to the crowds and walking tours that typically visit her.\n\nI really recommend this tour of the cemetery. There is a lot of history here (along with lore and urban legends). With an informed guide you’ll get a lot more out of your visit than you will with a solo wander. \n\nAround the cemetery you can see the massive gum tree, supposedly planted in 1823 by the religious order that inhabited the church you also see here. \n\nLa Biela is a classic cafe here with a beautiful outdoor setting for a coffee, but in full disclosure, I find it a bit overpriced for the quality and the grumpiness of the waiters.\n\nThe Recoleta Cultural Center is located right next door to the church with rotating art exhibits.\n\n![Booths of vendors are set up in the park in the Recoleta Plaza Francia feria](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2019/02/Recoleta-Feria-1-768x1024.jpg?strip=all)\n\n![Booths of vendors are set up in the park in the Recoleta Plaza Francia feria](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2019/02/Recoleta-Feria-1-768x1024.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-27.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-27.jpg?strip=all)\n\n#### Artisan Market \n\nHere on a weekend? The square in front of the cemetery is home to a weekly market every Saturday and Sunday.\n\nIt’s one of the best markets in Buenos Aires and a great place for souvenir shopping!\n\nIn the afternoon, musicians perform at the base of the grassy hill making it the perfect place to lay back and relax if the weather is sunny.\n\nIt takes place on both Saturday and Sunday, with artisans selling anything and everything. Since most markets take place only on Sundays (like San Telmo), I recommend visiting here on a Saturday.\n\n#### Pedestrian Bridge, the Law School, and the Floralis Generica\n\nDon’t leave Recoleta without taking a look at the larger than life metal flower across Alcorta Avenue next to the columned Law School building in United Nations Square.\n\nThis large aluminum flower was gifted to the city by an architect as a show of appreciation for the city that made him who he was.\n\nTo get there, take the pedestrian bridge that crosses Av. Alcorta. \n\nStop for a perfect panoramic view of the law school, the flower, and the avenue below (seen in the photo above). In November, this is the best place to see purple jacaranda blooms.\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2022/10/Best-Empanadas-in-Buenos-Aires-3-768x1024.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2022/10/Best-Empanadas-in-Buenos-Aires-3-768x1024.jpg?strip=all)\n\nLa Cocina\n\n![Two fried empanadas on a white plate](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2024/01/best-Buenos-Aires-empanadas-3-768x1024.jpg?strip=all)\n\n![Two fried empanadas on a white plate](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2024/01/best-Buenos-Aires-empanadas-3-768x1024.jpg?strip=all)\n\nSanjuanino\n\n#### Recoleta Lunch/Foodie Options \n\nHungry? Because I have even more lunch and food options coming your way.\n\n'}, {'id': 'ba-8', 'city': 'Buenos Aires', 'text': 'If you’re visiting on a Sunday for the market, I recommend starting at Plaza de Mayo, right at the beginning. \n\nFrom here, walk down Defensa towards Plaza Dorrego. \n\nIf you’re tight on time, you can start directly in Plaza Dorrego (especially if you already saw Plaza de Mayo on Day 1). \n\nThis is also the best idea if you’re hungry as most of the food recommendations above are near here.\n\nThe San Telmo Market takes place every Sunday and really gets going in the afternoon (this is not a city meant for the early riser).\n\nThere are stalls covering this street for ten blocks, with the antiques located mainly in Dorrego Square. \n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-33.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-33.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-32.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-32.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-31.jpg?strip=all)\n\n![](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2023/09/3-days-in-Buenos-Aires-itinerary-31.jpg?strip=all)\n\nDon’t miss Casa Ezeiza at Defensa 1179. \n\nThis is the classic example of a wealthy single family home that became tenement housing after the yellow fever outbreak. \n\nToday there are a couple cafes and boutiques inside. The little shops inside are great for treasure hunting.\n\nNot here on a Sunday? No worries. San Telmo has even more charm without the market, when you can wander here without the crowds. \n\nIn fact, I always recommend those with more time to visit San Telmo both on a Sunday and a weekday to see both sides to this barrio.\n\n#### Dinner in San Telmo\n\nIf you find yourself in San Telmo after sundown, hit up one of the parrillas I mention in the lunch recommendations.\n\nDesnivel or La Brigada will give you a steak you’ll never forget to round out this whirlwind three days in Buenos Aires.\n\nOtherwise, find a restaurant near your accommodation, this city has no shortage of dining. \n\n🗺 My Buenos Aires Interactive Map includes all of my favorite restaurants (and I continuously update it!). Use code SOLSALUTE for a reader discount.\n\n![An 18th century church and cobblestone street during the San Telmo market](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2019/02/Feria-de-San-Telmo-7-768x1024.jpg?strip=all)\n\n![An 18th century church and cobblestone street during the San Telmo market](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2019/02/Feria-de-San-Telmo-7-768x1024.jpg?strip=all)\n\n![Black and yellow taxis line up at a red light in front of a historic 18th century apartment block in Buenos Aires Argentina](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2025/02/Lunfarda-and-Argentine-Slang-in-Buenos-Aires-13-771x1024.jpg?strip=all)\n\n![Black and yellow taxis line up at a red light in front of a historic 18th century apartment block in Buenos Aires Argentina](https://ewj43icfkoo.exactdn.com/wp-content/uploads/2025/02/Lunfarda-and-Argentine-Slang-in-Buenos-Aires-13-771x1024.jpg?strip=all)\n\n\n\n'}, {'id': 'edi-1', 'city': 'Edinburgh', 'text': "## Explore Edinburgh\n\nSo, you've got three days in Edinburgh, you lucky thing. Much of the city centre is a UNESCO World Heritage Site and there’s no shortage of brilliant museums, dramatic vistas, fascinating historical attractions, and stunning architecture to soak in.\n\nMake the most your short stay in this enchanting city with our Edinburgh travel itinerary.\n\n## Day 1 - The Old Town: The Royal Mile, Canongate and Holyrood\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2022/08/26/royal-mile)\n\nView looking down the Royal Mile from the roof of St Giles Cathedral © VisitScotland / Kenny Lam\n\nEdinburgh’s Old Town lives and breathes history. It’s a warren of cobbled streets, wynds, lanes and dark alleys – it's easy to feel like you’ve stepped out of a time machine! Spend today discovering historic places and iconic sites and soak up the bustling Old Town atmosphere.\n\nThis trip includes:\n\n- Edinburgh Castle – just walking up the esplanade on approach, you know you’re about to step into one of Scotland’s most special historic buildings. Take in the views across the city and learn about the dramatic events which have played out between these ancient walls as you explore great halls, royal chambers, monuments, and dungeons. To avoid disappointment, make sure to book your tickets far in advance for guaranteed entry. \n- Palace of Holyroodhouse – this elegant royal residence has links to monarchs from throughout the centuries and is situated at the foot of the Royal Mile. Today it is the official Scottish residence of His Majesty The King. Take a tour and see Mary Queen of Scots’ bedchamber and the room where her confidante, David Rizzio, was brutally murdered.\n- Edinburgh bus tour – departing from Waverley Bridge, this hour-long hop-on, hop-off service gives you the freedom to explore the city in an exciting way. Highlights include the New and Old Towns, the Grassmarket to see Edinburgh Castle, the National Museum of Scotland, the Palace of Holyroodhouse, and much more. \n\nIf you've got time to explore further, check out:\n\n- Scottish Parliament – enjoy a free guided tour and learn about the history, inner workings and procedures of a day in the life in parliament.\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2024/01/11/edinburgh-castle-spring-daffodils.jpg)\n\nEdinburgh Castle in spring\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2022/07/04/palace-of-holyroodhouse)\n\nThe Palace Of Holyroodhouse © VisitScotland / Kenny Lam\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2022/07/25/edinburgh-city-sightseeing-bus)\n\nA City Sightseeing Bus in the Grassmarket © VisitScotland / Paul Tomkins\n\n![The Scottish Parliament building](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2023/07/05/scottish-parliament-building-.jpg)\n\nThe Scottish Parliament building © VisitScotland / Kenny Lam\n\n## Day 2 - Royal connections: Leith and New Town\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2025/07/16/the-royal-yacht-britannia.jpg)\n\nThe Royal Yacht Britannia, Edinburgh\n\nTake in the historic Port of Leith and the handsome Georgian New Town and you’ll find some rather wonderful sites to uncover.\n\n- The Royal Yacht Britannia – named by many as one of the best UK attractions, step on board the late Queen Elizabeth II's former floating Royal residence. Inside, you'll see the engine room, a Rolls Royce and state apartments across five decks. After the tour, take some time to explore the Shore in Leith, one of the most fashionable areas to live in Edinburgh.\n- The Royal Botanic Garden Edinburgh – spend a few hours touring its wonderful glasshouses, exhibitions and a world of colourful plants and shrubs. It's located in Inverleith and is just a mile from the city centre.\n- Enjoy some retail therapy – find a huge range of top high street brands and designer stores at Multrees Walk and St James Quarter.\n- Calton Hill – home to the National Monument and some superb city skyline views. \n- Scottish National Gallery – discover famous masterpieces and see world-class Scottish and international art through the centuries.\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2022/11/02/royal-botanic-garden-edinburgh)\n\nGlasshouses at the Royal Botanic Garden; Edinburgh © VisitScotland / Kenny Lam\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2022/06/23/st-james-quarter)\n\nSt James Quarter, Edinburgh © VisitScotland / Kenny Lam\n\n![](https://www.visitscotland.com/binaries/content/gallery/visitscotland/cms-images/2022/07/01/scottish-national-gallery-of-modern-art)\n\n"}]
          schema={'type': 'object', 'properties': {'activities': {'type': 'array', 'items': {'type': 'object', 'properties': {'name': {'type': 'string'}, 'quote': {'type': 'string'}, 'kind': {'type': 'string', 'enum': ['visit', 'zone', 'route', 'event']}, 'optional': {'type': 'boolean'}, 'condition': {'type': 'object', 'properties': {'kind': {'type': 'string', 'enum': ['none', 'weekday', 'other']}, 'weekdays': {'type': 'array', 'items': {'type': 'string', 'enum': ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']}}, 'quote': {'type': 'string'}}, 'required': ['kind', 'weekdays', 'quote'], 'additionalProperties': False}}, 'required': ['name', 'quote', 'kind', 'optional', 'condition'], 'additionalProperties': False}}}, 'required': ['activities'], 'additionalProperties': False}
          system='Extract named sightseeing activities from source text, not your knowledge. Return activities only. Exclude restaurants, cafes, food products, generic tours, hotels, shops, unnamed generic buildings. Exact source spelling for name; no expansions or corrections. quote must be one short exact contiguous source passage supporting this name and identity. kind visit=single attraction/building, zone=neighborhood/square/area, route=street walk, event=weekly market/festival. optional=true only if text says choice or can skip. condition kind weekday ONLY when this particular activity/event has a stated weekday restriction, never because whole travel day prefers Sunday. For weekday supply exact weekdays and literal source quote supporting those days. Saturday and Sunday means both. condition none requires weekdays=[] and quote empty. Other conditional claims use kind other, empty weekdays and literal quote. Never assign a market event condition to the surrounding neighborhood/plaza/church. For broad day narrative with no explicit restriction on the named entity use none. Output exact JSON shape given by schema. Do not infer current hours; we test meaning of the supplied text only.'
          log=(out/'server.log').open('w');server=subprocess.Popen(['llama.cpp/build/bin/llama-server','-m','model.gguf','--host','127.0.0.1','--port','8080','-c','8192','-b','256','-ub','128','-t','4','--parallel','1','--jinja','--skip-chat-parsing'],stdout=log,stderr=subprocess.STDOUT)
          for i in range(180):
           try:
            if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).status==200:break
           except Exception:time.sleep(1)
          else:raise RuntimeError('server-not-ready')
          rows=[]
          def post(path,payload):
           req=urllib.request.Request('http://127.0.0.1:8080'+path,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'});return json.load(urllib.request.urlopen(req,timeout=600))
          smoke=post('/completion',{'prompt':'Return the JSON object with ok true, no other words.','json_schema':{'type':'object','properties':{'ok':{'const':True}},'required':['ok'],'additionalProperties':False},'n_predict':50,'temperature':0})
          (out/'schema-smoke.json').write_text(json.dumps(smoke,indent=2))
          if json.loads(smoke['content'])!={'ok':True}:raise RuntimeError('schema-smoke-failed')
          for c in cases:
           start=time.monotonic();status='done';raw={};answer=None;accepted=[];rejected=[]
           messages=[{'role':'system','content':system+' Required JSON schema: '+json.dumps(schema)},{'role':'user','content':c['text']}]
           try:
            if os.environ.get('MODEL_MODE')=='chat':
             raw=post('/v1/chat/completions',{'messages':messages,'temperature':0,'seed':42,'max_tokens':4000,'response_format':{'type':'json_schema','json_schema':{'name':'extraction','schema':schema,'strict':True}},'chat_template_kwargs':json.loads(os.environ['MODEL_KWARGS'])})
             raw={'content':raw['choices'][0]['message']['content'],'reasoning':raw['choices'][0]['message'].get('reasoning_content','')[:2000],'finish_reason':raw['choices'][0].get('finish_reason')}
             import re as _re
             body=raw['content']
             m=_re.search(r'<\|channel\|>final<\|message\|>(.*)',body,_re.S)
             if m:body=m.group(1)
             body=body.strip();body=_re.sub(r'^```(?:json)?\s*','',body);body=_re.sub(r'\s*```\s*$','',body)
             answer=json.loads(body)
            else:
             formatted=post('/apply-template',{'messages':messages,'chat_template_kwargs':json.loads(os.environ['MODEL_KWARGS'])})
             raw=post('/completion',{'prompt':formatted['prompt'],'temperature':0,'seed':42,'n_predict':2200,'json_schema':schema})
             answer=json.loads(raw['content'])
           except urllib.error.HTTPError as ex:status='http:'+ex.read().decode()
           except Exception as ex:status='error:'+str(ex)
           if not isinstance(answer,dict) or not isinstance(answer.get('activities'),list):
            status='schema-root-invalid';rejected.append({'raw':answer,'issues':['schema-root-invalid']})
           if isinstance(answer,dict) and isinstance(answer.get('activities'),list):
            for a in answer['activities']:
             issues=[]
             if not isinstance(a,dict) or not all(k in a for k in ['name','quote','kind','optional','condition']):rejected.append({'raw':a,'issues':['shape']});continue
             if not a['name'] or a['name'] not in c['text']:issues.append('name-not-literal')
             if not a['quote'] or a['quote'] not in c['text']:issues.append('quote-not-literal')
             if a['name'] not in a['quote']:issues.append('name-not-in-quote')
             cond=a['condition']
             if not isinstance(cond,dict) or not all(k in cond for k in ['kind','weekdays','quote']):issues.append('condition-shape')
             elif cond['kind']=='none':
              if cond['weekdays'] or cond['quote']:issues.append('condition-none-conflict')
             else:
              if not cond['quote'] or cond['quote'] not in c['text']:issues.append('condition-quote-not-literal')
              if cond['kind']=='weekday' and not cond['weekdays']:issues.append('weekday-empty')
              if cond['kind']=='weekday' and any(d.casefold() not in cond['quote'].casefold() for d in cond['weekdays']):issues.append('weekday-not-in-quote')
             (rejected if issues else accepted).append({'activity':a,'issues':issues})
           row={'case':c['id'],'city':c['city'],'source':c['text'],'status':status,'seconds':round(time.monotonic()-start,2),'accepted':accepted,'rejected':rejected}
           (out/(c['id']+'-raw.json')).write_text(json.dumps(raw,ensure_ascii=False,indent=2));rows.append(row)
           (out/'results.json').write_text(json.dumps({'model':os.environ['MODEL_NAME'],'mode':'literal-evidence-condition-validation','cases':rows,'caveat':'Span checks necessary not sufficient. Human semantic evaluation and external identity resolution follow; never score abstention as correct discovery.'},ensure_ascii=False,indent=2));print(json.dumps({k:v for k,v in row.items() if k!='source'},ensure_ascii=False),flush=True)
          server.terminate();server.wait(timeout=20)
          PYBENCH
      - name: Save source-only benchmark evidence
        if: always()
