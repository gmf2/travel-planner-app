name: Tripio source semantic benchmark
on:
  push:
    branches: [tripio-source-benchmark]
    paths: [.github/workflows/source-benchmark.yml]
permissions:
  contents: read
concurrency:
  group: tripio-source-benchmark
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build pinned open source inference tool
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp llama.cpp
          git -C llama.cpp checkout e486a4b
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-completion -j 4
      - name: Download public model without an account
        env:
          MODEL_URL: https://huggingface.co/bartowski/Qwen_Qwen3-4B-GGUF/resolve/cb76885dc66d50759b207c5a48c4e78dfa00c638/Qwen_Qwen3-4B-Q4_K_M.gguf
        run: |
          curl --fail --location --retry 1 --max-time 300 "$MODEL_URL" --output model.gguf
      - name: Evaluate public-source semantic cases
        run: |
          python3 - <<'PYBENCH'
          import json, subprocess, pathlib, time
          cases = [{'id': 'cape-town-alternative-unseeded', 'source': 'https://www.capetown.travel/itineraries-tours/three-day-family-itinerary-for-cape-town/', 'passage': 'DAY 1: EXPLORING THE CITY. Next, head down to the Green Point Urban Park to see a unique space in the middle of an urban environment. Alternatively, visit Deer Park Café in its idyllic setting just above the city bowl.', 'task': 'Extract only the two named alternative activities from the passage. Do not add other city attractions. Return {"activities":[{"name":string,"type":"park" or "cafe"}],"alternative":true}. Preserve source names exactly and source order.', 'schema': {'type': 'object', 'properties': {'activities': {'type': 'array', 'items': {'type': 'object', 'properties': {'name': {'type': 'string'}, 'type': {'type': 'string', 'enum': ['park', 'cafe']}}, 'required': ['name', 'type'], 'additionalProperties': False}}, 'alternative': {'type': 'boolean'}}, 'required': ['activities', 'alternative'], 'additionalProperties': False}, 'expected': {'activities': [{'name': 'Green Point Urban Park', 'type': 'park'}, {'name': 'Deer Park Café', 'type': 'cafe'}], 'alternative': True}}, {'id': 'mexico-narrative-days', 'source': 'https://mexicocity.cdmx.gob.mx/e/itineraries-better-planning/3-day-mexico-city-travel-itineraries/?lang=en', 'passage': 'Our three day agenda begins in Chapultepec Park, which is itself a massive set of attractions and sights to behold. Day one starts here. Day two you’ll tackle the City Center, starting at the Zócalo. Day Three takes on San Juan Moyotlan and the Alameda Area.', 'task': 'Extract day groups, no invented individual buildings. Return {"days":[{"day":integer,"areas":[names]}]}. Use exactly the spellings in the passage, preserving order. The third day has two areas.', 'schema': {'type': 'object', 'properties': {'days': {'type': 'array', 'items': {'type': 'object', 'properties': {'day': {'type': 'integer'}, 'areas': {'type': 'array', 'items': {'type': 'string'}}}, 'required': ['day', 'areas'], 'additionalProperties': False}}}, 'required': ['days'], 'additionalProperties': False}, 'expected': {'days': [{'day': 1, 'areas': ['Chapultepec Park']}, {'day': 2, 'areas': ['City Center', 'Zócalo']}, {'day': 3, 'areas': ['San Juan Moyotlan', 'Alameda Area']}]}}, {'id': 'cape-town-transport-not-walk', 'source': 'https://www.capetown.travel/itineraries-tours/three-day-family-itinerary-for-cape-town/', 'passage': 'DAY 2: SUBURBAN ADVENTURE. With sparse public transport in the area, renting a car is probably the best way to get around Cape Town’s Southern Suburbs on day two.', 'task': 'Does this passage support presenting day2 as a compact central walking itinerary with verified walking minutes? Return {"day":integer,"centralWalkSupported":boolean,"recommendedTransport":string,"verifiedMinutes":null}. recommendedTransport must quote the exact relevant phrase, not a new transport recommendation.', 'schema': {'type': 'object', 'properties': {'day': {'type': 'integer'}, 'centralWalkSupported': {'type': 'boolean'}, 'recommendedTransport': {'type': 'string'}, 'verifiedMinutes': {'type': 'null'}}, 'required': ['day', 'centralWalkSupported', 'recommendedTransport', 'verifiedMinutes'], 'additionalProperties': False}, 'expected': {'day': 2, 'centralWalkSupported': False, 'recommendedTransport': 'renting a car', 'verifiedMinutes': None}}]
          out = pathlib.Path('benchmark-results'); out.mkdir(exist_ok=True)
          results=[]
          for c in cases:
              schema=c['schema']
              prompt='<|im_start|>system\nExtract only from the supplied public source passage. Output only JSON. Do not add facts. /no_think<|im_end|>\n<|im_start|>user\n'+c['passage']+'\n'+c['task']+' /no_think<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n'
              (out/'prompt.txt').write_text(prompt)
              (out/'schema.json').write_text(json.dumps(schema))
              cmd=['llama.cpp/build/bin/llama-completion','-m','model.gguf','-f',str(out/'prompt.txt'),'--no-conversation','--no-display-prompt','-c','2048','-b','128','-ub','128','-n','500','-t','4','--temp','0.6','--top-p','0.8','--seed','42','-jf',str(out/'schema.json')]
              start=time.monotonic(); answer=None; status='done'; raw=''
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=240)
                  raw=p.stdout
                  if p.returncode: status='process-error'
                  try: answer=json.loads(raw.split('[end of text]')[0].strip())
                  except ValueError: status='invalid-json'
              except subprocess.TimeoutExpired: status='timeout'
              result={'case':c['id'],'source':c['source'],'expected':c['expected'],'answer':answer,'status':status,'seconds':round(time.monotonic()-start,2),'passExact':status=='done' and answer==c['expected']}
              results.append(result); print(json.dumps(result,ensure_ascii=False),flush=True)
          summary={'model':'bartowski/Qwen_Qwen3-4B-GGUF/Qwen_Qwen3-4B-Q4_K_M.gguf','revision':'cb76885dc66d50759b207c5a48c4e78dfa00c638','cases':results,'passed':sum(x['passExact'] for x in results),'total':len(results),'caveat':'Tiny source-semantic feasibility test, not validated global tourist advice. No app deployment.'}
          (out/'results.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          raise SystemExit(0 if all(x['passExact'] for x in results) else 1)
          PYBENCH
      - name: Save benchmark summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-semantic-results
          path: benchmark-results/results.json
          retention-days: 7
          if-no-files-found: warn
