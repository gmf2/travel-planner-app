           if a['name'] in ['MALBA','Bellas Arts'] and not a.get('optional'):issues.append('museum-option-lost:'+a['name'])
          result={'model':os.environ['MODEL_NAME'],'source':'https://solsalute.com/blog/3-days-in-buenos-aires-itinerary/','mode':'three-untruncated-source-days','template':'model-embedded Jinja via llama-server, not Qwen tokens','sections':rows,'semanticIssues':issues,'fullDays':True,'caveat':'Extraction test only. Full day1-3 prose including unrelated food/tours, without city-specific hints. Text spans verified deterministically. No global discovery or production quality claim.'}
          (out/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps({'model':os.environ['MODEL_NAME'],'semanticIssues':issues,'fullDays':True},ensure_ascii=False),flush=True)
